<div class="modal-content">
    <div class="modal-header d-flex justify-content-between align-items-center">
        <h4 class="modal-title mb-0">{{productData?.title}}</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close()"></button>
    </div>

    <div class="modal-body">
        <div class="row">
            <div class="col-md-5">
                <div class="product-img">
                    <img src="../../../assets/image/product/cctv/dahua_hdcvi_camera_dom.png">
                </div>
            </div>
            <div class="col-md-7">
                <!-- Description Section -->
                <div class="mb-4">
                    <h6 class="mb-2 d-flex align-items-center f-w-700">
                        <span>
                            <i class="fa-solid fa-list me-2"></i>
                        </span> Description
                    </h6>
                    <p>
                        {{productData?.description}}
                    </p>
                </div>

                <!-- Key Features Section -->
                <div class="mb-4">
                    <h6 class="mb-2 d-flex align-items-center f-w-700">
                        <span>
                            <i class="fa-solid fa-star me-2"></i>
                        </span>
                        Key Features
                    </h6>
                    <ul class="list-unstyled">
                        @for(item of productData?.short_desc; track $index){
                        <li class="mb-2">• {{item}}</li>
                        }
                    </ul>


                    <!-- available range -->
                    <div class="mb-4">
                        <h6 class="mb-2 d-flex align-items-center">
                            <span>
                                <i class="fa-brands fa-stack-exchange me-2"></i>
                            </span>
                            Available Range
                        </h6>
                        <ul class="list-unstyled">
                            @for(item of productData?.other_desc; track $index){
                            <li class="mb-2">• {{item}}</li>
                            }
                        </ul>
                    </div>
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <button class="p-btn" (click)="redirectToWhatsApp(productData)">Inquiry</button>
        </div>
    </div>
</div>
