<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>JP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    .app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .app-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .concept3-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .concept3-ripple {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--secondary-color);
      animation: ripple 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }

    .concept3-ripple:nth-child(2) {
      animation-delay: 0.6s;
    }

    .concept3-ripple:nth-child(3) {
      animation-delay: 1.2s;
    }

    .concept3-logo {
      width: 75px;
      height: 75px;
      object-fit: contain;
      z-index: 5;
      filter: drop-shadow(0 0 15px var(--secondary-color));
    }

    @keyframes ripple {
      0% {
        transform: scale(0.4);
        opacity: 1;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="initial-preloader" class="app-preloader">
    <div class="concept3-wrapper">
      <div class="concept3-ripple"></div>
      <div class="concept3-ripple"></div>
      <div class="concept3-ripple"></div>
      <img src="assets/image/logo/white_logo.png" alt="JP Logo" class="concept3-logo"
        onerror="this.src='assets/image/logo/logo.jpg'">
    </div>
  </div>

  <app-root></app-root>

  <script>
    setTimeout(function () {
      var preloader = document.getElementById('initial-preloader');
      if (preloader) {
        preloader.classList.add('fade-out');
        setTimeout(function () {
          preloader.remove();
        }, 600);
      }
    }, 2000);
  </script>
</body>

</html>
